name: Lesson checks
on: [push, pull_request]
jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r tests/requirements-download.txt
      - run: python -m unittest discover -s tests -p 'test_download_practices.py'
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-check-failures
          path: test-results/
          if-no-files-found: ignore
