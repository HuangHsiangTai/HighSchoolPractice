 x，利用 log_x 10=1/log x，把方程化成 y 的二次方程；最後由 x=10^y 還原並檢查對數定義域。", "steps": ["題目中的 log 依常用對數解讀，定義域要求 x>0 且 x≠1。令 y=log x，則 log_x10=1/y。", "代入得 y−12/y+1=0。因 y≠0，乘以 y 得 y²+y−12=0。", "因式分解：(y+4)(y−3)=0，所以 y=−4 或 y=3。", "還原 x=10^y，得 x=10⁻⁴ 或 10³。兩值皆大於 0 且不等於 1，均符合原式。"], "answerStatus": "verified", "answer": null, "answerText": "x=10⁻⁴ 或 10³（即 0.0001 或 1000）。", "optionAnalysis": {}, "pitfalls": ["換底後 log_x10=1/log x，不能誤寫成 log x。", "檢查底數 x>0 且 x≠1；乘以 y 前也需知道 y≠0。"], "notes": ["題目未在 log 後標底數，依常用對數慣例解讀為底數 10。"], "practice": {"type": "multiple_choice", "stem": "解方程 log x−6log_x10+1=0（log 為常用對數），選出所有解。", "options": {"A": "10⁻³", "B": "10²", "C": "1", "D": "10⁻⁴"}, "requiredSelections": 2, "answer": ["A", "B"], "answerText": "A、B。", "steps": ["令 y=log x，則 log_x10=1/y。", "y−6/y+1=0，乘以 y 得 y²+y−6=0=(y+3)(y−2)，故 y=−3 或 2。", "x=10^y，因此 x=10⁻³ 或 10²；均符合底數條件。"], "grading": {}}}}, {"id": "p2-fill-7", "questionVersion": 1, "type": "numeric", "number": "7", "source": {"image": "20261114_數週2_2.jpg", "page": "第1頁，填充第7題", "crop": {"x": 100, "y": 1180, "width": 1400, "height": 270}}, "stem": "解方程式：2(x^{log 3})(3^{log x})−5x^{log 3}−3=0，則 x=＿＿。", "options": {}, "requiredSelections": null, "diagram": null, "uncertainties": [], "solution": {"id": "p2-fill-7", "questionVersion": 1, "topic": "指數對稱恆等式與代換", "insight": "利用 x^(log 3)=3^(log x)（常用對數）合併指數項，設共同值 t；再解二次式並用 t>0 篩選。", "steps": ["定義域 x>0。由 x^(log3)=10^(logx·log3)=3^(logx)，令共同值 t>0。", "原式化為 2t²−5t−3=0，因式分解為 (2t+1)(t−3)=0。", "因 t>0，捨去 t=−1/2，只留 t=3。", "由 x^(log3)=3=3¹，且 log3>0，得 log x=1，因此 x=10。代回時兩個指數冪均為 3，原式為 18−15−3=0。"], "answerStatus": "verified", "answer": null, "answerText": "x=10。", "optionAnalysis": {}, "pitfalls": ["必須先註明 x>0 才能使用 log x。", "二次方程的根 t=−1/2 不符合 t=x^(log3)>0，須排除。"], "notes": ["log 未標底數，依常用對數慣例解讀為底數 10。"], "practice": {"type": "numeric", "stem": "解方程 3(x^(log 2))(2^(log x))−10x^(log 2)−8=0（log 為常用對數），求 x。", "options": {}, "requiredSelections": null, "answer": "100", "answerText": "x=100", "steps": ["x>0，且 x^(log2)=2^(logx)，令 t 為共同正值。", "方程變成 3t²−10t−8=0=(3t+2)(t−4)，由 t>0 得 t=4。", "x^(log2)=4=2²，log x=2，故 x=100。代回原方程得 48−40−8=0。"], "grading": {"unit": "無單位", "tolerance": 0}}}}]</script><script>
'use strict';const questions=JSON.parse(document.getElementById('lesson-data').textContent),nav=document.getElementById('question-nav'),panels=document.getElementById('panels');const state=new Map(questions.map(q=>[q.id,{step:1,correct:false}]));let current=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rich(v){let s=esc(v);s=s.replace(/\^\{([^{}]+)\}/g,'<sup>$1</sup>').replace(/\^\(([^()]*)\)/g,'<sup>$1</sup>').replace(/\^([−-]?[A-Za-z0-9]+)/g,'<sup>$1</sup>').replace(/log_([A-Za-z0-9]+)/g,'log<sub>$1</sub>').replace(/logₓ/g,'log<sub>x</sub>').replace(/log₂/g,'log<sub>2</sub>').replace(/∛([0-9]+)/g,'<span class="math">∛$1</span>').replace(/10⁻⁴/g,'10<sup>−4</sup>').replace(/10³/g,'10<sup>3</sup>').replace(/x⁻¹/g,'x<sup>−1</sup>').replace(/x⁻²/g,'x<sup>−2</sup>');return s.replace(/\n/g,'<br>')}
function original(q){if(q.id==='p1-fill-6')return `<p class="stem">試求：(1) <span class="frac"><span>27<sup>200</sup></span><span>5<sup>300</sup></span></span> 為＿＿位數。(2) <span class="frac"><span>27<sup>200</sup></span><span>5<sup>300</sup></span></span> 的最高位數字為＿＿。（log 2≈0.3010，log 3≈0.4771）</p>`;return `<p class="stem">${rich(q.stem)}</p>`}
function practiceControl(q,p){if(p.type==='single_choice'||p.type==='multiple_choice'){let inputType=p.type==='single_choice'?'radio':'checkbox';return `<fieldset class="practice-options"><legend>請${inputType==='radio'?'選一項':'選出所有正確項目'}</legend>${Object.entries(p.options).map(([k,v])=>`<label class="practice-option"><input type="${inputType}" name="choice" value="${esc(k)}"><span><strong>(${esc(k)})</strong> ${rich(v)}</span></label>`).join('')}</fieldset>`}let g=p.grading;return `<label class="number-row" for="answer-${q.id}">答案 <input id="answer-${q.id}" name="numeric-answer" type="number" step="any" aria-describedby="unit-${q.id} hint-${q.id}"><span class="unit" id="unit-${q.id}">${esc(g.unit)}</span></label><small class="grading-hint" id="hint-${q.id}">容許誤差 ±${g.tolerance}</small>`}
function render(q,i){let s=q.solution,p=s.practice,amb=s.answerStatus==='ambiguous';let steps=s.steps.map((v,n)=>`<li class="step ${n?'step-hidden':''}"><span>${rich(v)}</span></li>`).join(''),psteps=p.steps.map(v=>`<li><span>${rich(v)}</span></li>`).join('');let opts=Object.entries(p.options).map(([k,v])=>`<li><b>${k}</b> ${rich(v)}：${(p.answer.includes(k)?'正確。':'不正確。')}</li>`).join('');return `<article class="panel" data-qid="${q.id}" id="panel-${q.id}" ${i?'hidden':''}><header class="panel-head"><span class="kicker">${q.source.image} · 填充第 ${q.number} 題</span><h2>${rich(s.topic)}</h2><span class="tag ${amb?'ambiguous':''}">${amb?'原題條件有疑義':'答案已驗證'}</span></header><section class="section"><h3>原題</h3><div class="question-box">${original(q)}</div><p class="source">來源：${esc(q.source.image)}，${esc(q.source.page)}</p></section><section class="section"><h3>讀題切入點</h3><p class="insight">${rich(s.insight)}</p></section><section class="section"><h3>逐步推導</h3><ol class="steps solution-steps">${steps}</ol><div class="controls"><button data-action="prev-step">上一步</button><button data-action="next-step">下一步</button><button data-action="show-all">展開全部</button></div></section><section class="section original-answer"><h3>${amb?'原題條件有疑義':'原題答案'}</h3><div class="answer-box ${amb?'ambiguous':''}"><p class="answer-title">${amb?'依原題文字無符合條件的解':'已獨立驗證'}</p><p class="answer-text">${rich(s.answerText)}</p>${amb?`<div class="notes"><strong>辨識核對與疑義：</strong>題面座標已放大確認為 A(a+1,b−1)、B(5a−3,2b−1)。由座標交換關係形式推得的候選值仍須代回曲線；A=(5/3,1/3) 不在 y=10<sup>x</sup> 上，因此 k=2 不是答案，原題條件互相矛盾。</div>`:''}</div></section><section class="section"><h3>注意事項</h3><ul class="pitfalls">${s.pitfalls.map(x=>`<li>${rich(x)}</li>`).join('')}</ul></section><section class="section"><div class="practice-card"><h3>變化練習</h3><p>${rich(p.stem)}</p><form data-qid="${q.id}">${practiceControl(q,p)}<div class="controls"><button class="primary" type="submit" data-action="submit-practice">送出作答</button><button type="button" data-action="retry-practice" hidden>重新作答</button></div><div class="feedback" role="status" aria-live="polite"></div><div class="practice-solution" hidden><h4>答案與解析</h4><p class="score"></p><p>${rich(p.answerText)}</p>${opts?`<ul>${opts}</ul>`:''}<ol class="steps">${psteps}</ol></div></form></div></section></article>`}
questions.forEach((q,i)=>{let b=document.createElement('button');b.type='button';b.dataset.qid=q.id;b.textContent=`${q.source.image.endsWith('_1.jpg')?'第1張':'第2張'}·${q.number}`;b.setAttribute('aria-controls',`panel-${q.id}`);nav.append(b);panels.insertAdjacentHTML('beforeend',render(q,i))});function panel(){return panels.querySelector(`article[data-qid="${questions[current].id}"]`)}function progress(){document.querySelector('#completion-count').textContent=questions.filter(q=>state.get(q.id).correct).length;document.querySelector('#progress-copy').textContent=`第 ${current+1} / ${questions.length} 題`}
function steps(id){let el=panels.querySelector(`[data-qid="${id}"]`),st=state.get(id),rows=el.querySelectorAll('.solution-steps .step');rows.forEach((x,i)=>x.classList.toggle('step-hidden',i>=st.step));el.querySelector('[data-action=prev-step]').disabled=st.step<=1;el.querySelector('[data-action=next-step]').disabled=st.step>=rows.length}
function show(i){current=Math.max(0,Math.min(questions.length-1,i));questions.forEach((q,j)=>{panels.querySelector(`[data-qid="${q.id}"]`).hidden=j!==current;let b=nav.querySelector(`[data-qid="${q.id}"]`);if(j===current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.querySelector('#prev-question').disabled=current===0;document.querySelector('#next-question').disabled=current===questions.length-1;progress();steps(questions[current].id)}
function resetPractice(id){let f=panels.querySelector(`form[data-qid="${id}"]`);f.reset();f.querySelector('.feedback').textContent='';f.querySelector('.feedback').removeAttribute('data-state');f.querySelector('.practice-solution').hidden=true;f.querySelector('[data-action=submit-practice]').hidden=false;f.querySelector('[data-action=retry-practice]').hidden=true;state.get(id).correct=false;progress()}function reset(id){resetPractice(id);state.get(id).step=1;steps(id)}
nav.addEventListener('click',e=>{let b=e.target.closest('button[data-qid]');if(b)show(questions.findIndex(q=>q.id===b.dataset.qid))});document.querySelector('#prev-question').onclick=()=>show(current-1);document.querySelector('#next-question').onclick=()=>show(current+1);document.querySelector('#reset-question').onclick=()=>reset(questions[current].id);
panels.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let el=b.closest('article'),id=el.dataset.qid,st=state.get(id),n=el.querySelectorAll('.solution-steps .step').length;if(b.dataset.action==='prev-step')st.step=Math.max(1,st.step-1);if(b.dataset.action==='next-step')st.step=Math.min(n,st.step+1);if(b.dataset.action==='show-all')st.step=n;if(b.dataset.action==='retry-practice')resetPractice(id);steps(id)});
panels.addEventListener('submit',e=>{let f=e.target.closest('form[data-qid]');if(!f)return;e.preventDefault();let q=questions.find(x=>x.id===f.dataset.qid),p=q.solution.practice,fb=f.querySelector('.feedback'),correct=false;if(p.type==='single_choice'||p.type==='multiple_choice'){let selected=[...f.querySelectorAll('input[name=choice]:checked')].map(x=>x.value).sort(),answer=[...p.answer].sort();if(!selected.length){fb.dataset.state='empty';fb.textContent='請先選擇答案，再送出。';return}correct=selected.length===answer.length&&selected.every((x,i)=>x===answer[i])}else{let inp=f.querySelector('[name=numeric-answer]');if(!inp.value){fb.dataset.state='empty';fb.textContent='請先輸入答案，再送出。';inp.focus();return}correct=Math.abs(Number(inp.value)-Number(p.answer))<=Number(p.grading.tolerance)}state.get(q.id).correct=correct;fb.dataset.state=correct?'correct':'wrong';fb.textContent=correct?'答對了！可以查看解析。':'答案尚未正確，請查看解析。';f.querySelector('.practice-solution').hidden=false;f.querySelector('.score').textContent=correct?'判定：正確':'判定：尚未答對';f.querySelector('[data-action=submit-practice]').hidden=true;f.querySelector('[data-action=retry-practice]').hidden=false;progress()});let ds=[];window.addEventListener('beforeprint',()=>{ds=[...document.querySelectorAll('details')].map(x=>[x,x.open]);ds.forEach(x=>x[0].open=true)});window.addEventListener('afterprint',()=>{ds.forEach(x=>x[0].open=x[1]);ds=[]});show(0);
</script></body></html>
