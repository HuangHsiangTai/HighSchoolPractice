<script type="application/json" id="lesson-data">[{"id": "system-3", "questionVersion": 1, "type": "text", "number": "3", "source": {"file": "20261106數輔2-1.jpg", "page": 1, "crop": {"x": 300, "y": 1840, "width": 900, "height": 300}}, "stem": "解方程組：\n\n{ z^x = y^(2x)\n  2^z = 2·4^x\n  x + y + z = 16 }", "options": {}, "requiredSelections": null, "diagram": null, "uncertainties": [], "solution": {"id": "system-3", "questionVersion": 1, "topic": "指數聯立方程：分情況避免漏解", "insight": "先由同底數的第二式求出 z 與 x 的關係；第一式須分 x＝0 與 x≠0，再做消去。原卷未註明底數限制，先採高中常見的正底數慣例 y,z>0。", "steps": ["2^z＝2·4^x＝2^(2x+1)，所以 z＝2x+1。由總和得 y＝15−3x。", "先檢查 x＝0：z＝1、y＝15；1^0＝15^0＝1，得到 (0,15,1)。", "若 x≠0，因 y,z>0，z^x＝(y²)^x 且正數的非零次方具單射性，因此 z＝y²。", "以 x＝(y²−1)/2 代入 x+y+z＝16：3y²+2y−33＝0，即 (3y+11)(y−3)＝0。", "正底數慣例下 y>0，取 y＝3，得 x＝4、z＝9。另一代數根 y＝−11/3 不符此慣例。", "代回：(4,3,9) 使 9^4＝3^8、2^9＝2·4^4、4+3+9＝16；(0,15,1) 三式也皆成立。"], "answerStatus": "ambiguous", "answer": null, "answerText": "採高中常見正底數慣例 y,z>0：(x,y,z)＝(0,15,1) 或 (4,3,9)。原卷未明定定義域；若允許負底數的有理次方，另有 (56/9,−11/3,121/9)。", "optionAnalysis": {}, "pitfalls": ["不可直接除以 x 或取 1/x 次方，否則漏掉 x＝0。", "2^z 對所有實數 z 都有定義，不能由第二式宣稱 z>0；正底數限制是第一式的實指數慣例。", "原題是非選擇題；應寫出完整三元組，並交代定義域。"], "notes": ["負底數延伸：x＝56/9、2x＝112/9 分母皆為奇數，(-11/3)^(112/9) 可取實數值，且等於 (121/9)^(56/9)，三式均成立。此解僅在允許負底數有理次方時納入。", "擴充解讀亦無其餘負 z 解：x≠0 時取絕對值得 |z|＝y²；若 z<0，消去後有 3y²−2y+33＝0，判別式 −392<0。"], "practice": {"type": "numeric", "stem": "把原方程組第三式改為 x+y+z＝7，其餘兩式不變，並明定 x 為實數、y,z>0。此方程組共有幾組實數解？", "options": {}, "requiredSelections": null, "answer": 2, "answerText": "2 組實數解。", "grading": {"unit": "組", "tolerance": 0}, "steps": ["z＝2x+1、y＝6−3x。若 x＝0，得 (0,6,1)，是一組解。", "若 x≠0，z＝y²，故 (6−3x)²＝2x+1，整理為 9x²−38x+35＝0。", "x＝(19±√46)/9。加號使 y＝(−1−√46)/3<0，捨去；減號使 y＝(√46−1)/3>0、z＝(47−2√46)/9>0，成立。", "非零分支只有一組，加上 x＝0 的一組，共 2 組。"]}}}, {"id": "numeric-5", "questionVersion": 2, "type": "numeric", "number": "5", "source": {"file": "20261106數輔2-2.jpg", "page": 2, "crop": {"x": 200, "y": 780, "width": 1400, "height": 220}}, "stem": "(log(x/3))(log(6/x)) + 10 = 0 x＝1/2。", "optionAnalysis": {}, "pitfalls": ["對數值可以是負數；t＝−1 不能捨去。", "底數 x 不能為1；乘以 t 前須先確認 t≠0。", "二次方程解出的是 t，不是 x，最後要轉回 x＝2^t。"], "notes": [], "practice": {"type": "multiple_choice", "stem": "解方程式 log₂x−3logₓ2＝0。下列哪些是解？（選2項）", "options": {"A": "2^√3", "B": "2^(−√3)", "C": "1", "D": "−2^√3"}, "requiredSelections": 2, "answer": ["A", "B"], "answerText": "A、B：x＝2^√3 或 2^(−√3)。", "steps": ["定義域 x>0、x≠1。令 t＝log₂x≠0，得 t−3/t＝0。", "同乘 t 得 t²＝3，故 t＝±√3，轉回 x＝2^(±√3)。兩者均正且不等於1，代回皆為0。", "A、B 正確；C 的底數1不合法；D 為負數，不在定義域。B雖小於1，仍是合法底數。"]}}}]</script><script>

 return `<p class="stem">解方程式：log<sub>2</sub> <i>x</i> − 5·log<sub><i>x</i></sub> 2＝4。</p>`;}
function practiceControl(q,p){if(p.type==='multiple_choice')return `<fieldset class="practice-options"><legend class="sr-only">請選擇答案</legend>${Object.entries(p.options).map(([k,v])=>`<label class="practice-option"><input type="checkbox" name="choice" value="${esc(k)}"><span><strong>(${esc(k)})</strong> ${rich(v)}</span></label>`).join('')}</fieldset>`;const g=p.grading,tolerance=g.tolerance===0?'精確相符（容許誤差 0）':`容許誤差 ±${g.tolerance}`;return `<label class="number-row" for="answer-${esc(q.id)}"><span>請填答案：</span><input id="answer-${esc(q.id)}" name="numeric-answer" type="number" step="any" inputmode="decimal" aria-describedby="unit-${esc(q.id)} hint-${esc(q.id)}"><span class="unit" id="unit-${esc(q.id)}">${esc(g.unit)}</span></label><small class="grading-hint" id="hint-${esc(q.id)}">${tolerance}</small>`;}
function render(q,i){const s=q.solution,p=s.practice,steps=s.steps.map((v,n)=>`<li class="step ${n?'step-hidden':''}" data-step="${n+1}"><span>${rich(v)}</span></li>`).join(''),psteps=p.steps.map(v=>`<li><span>${rich(v)}</span></li>`).join('');const notes=s.notes.length?`<details class="notes"><summary>定義域與其他解讀（選讀）</summary><ul>${s.notes.map(n=>`<li>${rich(n)}</li>`).join('')}</ul></details>`:'';const options=Object.entries(s.optionAnalysis).map(([k,v])=>`<li><strong>${esc(k)}</strong> ${rich(v)}</li>`).join('');return `<article class="panel" id="panel-${esc(q.id)}" data-qid="${esc(q.id)}" aria-labelledby="title-${esc(q.id)}" ${i?'hidden':''}><header class="panel-head"><span class="kicker">填充題 · 第 ${esc(q.number)} 題</span><h2 id="title-${esc(q.id)}">${rich(s.topic)}</h2><span class="tag ${s.answerStatus==='ambiguous'?'ambiguous':''}">${s.answerStatus==='ambiguous'?'答案含定義域說明':'答案已驗證'}</span></header><section class="section"><h3>原題</h3><div class="question-box">${original(q)}</div><p class="source">來源：${esc(q.source.file)}，第 ${esc(q.source.page)} 頁。</p></section><section class="section"><h3>讀題切入點</h3><p class="insight"><strong>先看：</strong>${rich(s.insight)}</p></section><section class="section"><h3>逐步推導</h3><ol class="steps solution-steps">${steps}</ol><div class="controls"><button type="button" data-action="prev-step">上一步</button><button type="button" class="primary" data-action="next-step">下一步</button><button type="button" data-action="show-all">展開全部</button></div></section><section class="section original-answer"><h3>${s.answerStatus==='ambiguous'?'原題答案與定義域說明':'原題答案'}</h3><div class="answer-box ${s.answerStatus==='ambiguous'?'ambiguous':''}"><p class="answer-title">${s.answerStatus==='ambiguous'?'依常見高中定義，並保留原題定義域疑義':'已驗證答案'}</p><p class="answer-text">${rich(s.answerText)}</p>${options?`<ul class="analysis">${options}</ul>`:''}${notes}</div></section><section class="section"><h3>注意事項</h3><ul class="pitfalls">${s.pitfalls.map(v=>`<li>${rich(v)}</li>`).join('')}</ul></section><section class="section"><div class="practice-card"><h3>變化練習</h3><p class="practice-stem">${rich(p.stem)}</p><form data-qid="${esc(q.id)}" novalidate>${practiceControl(q,p)}<div class="controls"><button type="submit" data-action="submit-practice" class="primary">送出作答</button><button type="button" data-action="retry-practice" class="secondary" hidden>重新作答</button></div><div class="feedback" role="status" aria-live="polite"></div><div class="practice-solution" hidden><h4>答案與解析</h4><p class="score"></p><p>${rich(p.answerText)}</p><ol class="steps">${psteps}</ol></div></form></div></section></article>`}
questions.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.dataset.qid=q.id;b.textContent=`第 ${q.number} 題`;b.setAttribute('aria-controls',`panel-${q.id}`);b.id=`nav-${q.id}`;nav.append(b);panels.insertAdjacentHTML('beforeend',render(q,i));});
function panel(){return panels.querySelector(`article[data-qid="${CSS.escape(questions[current].id)}"]`)}function setProgress(){document.getElementById('progress-copy').textContent=`第 ${current+1} / ${questions.length} 題`;document.getElementById('completion-count').textContent=String(questions.filter(q=>state.get(q.id).correct).length)}
function updateSteps(id){const p=panels.querySelector(`article[data-qid="${CSS.escape(id)}"]`),st=state.get(id),rows=[...p.querySelectorAll('.solution-steps .step')];rows.forEach((el,i)=>el.classList.toggle('step-hidden',i>=st.step));p.querySelector('[data-action=prev-step]').disabled=st.step<=1;p.querySelector('[data-action=next-step]').disabled=st.step>=rows.length;p.querySelector('[data-action=show-all]').textContent=st.step>=rows.length?'已展開全部':'展開全部';}
function show(i){current=Math.max(0,Math.min(questions.length-1,i));questions.forEach((q,j)=>{panels.querySelector(`article[data-qid="${CSS.escape(q.id)}"]`).hidden=j!==current;const b=document.getElementById(`nav-${q.id}`);if(j===current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.getElementById('prev-question').disabled=current===0;document.getElementById('next-question').disabled=current===questions.length-1;setProgress();updateSteps(questions[current].id)}
document.getElementById('prev-question').addEventListener('click',()=>show(current-1));document.getElementById('next-question').addEventListener('click',()=>show(current+1));nav.addEventListener('click',e=>{const b=e.target.closest('button[data-qid]');if(b)show(questions.findIndex(q=>q.id===b.dataset.qid))});document.getElementById('reset-question').addEventListener('click',()=>reset(questions[current].id));
panels.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const p=b.closest('article'),id=p.dataset.qid,steps=p.querySelectorAll('.solution-steps .step'),s=state.get(id);if(b.dataset.action==='prev-step')s.step=Math.max(1,s.step-1);if(b.dataset.action==='next-step')s.step=Math.min(steps.length,s.step+1);if(b.dataset.action==='show-all')s.step=steps.length;if(b.dataset.action==='retry-practice')resetPractice(id);updateSteps(id)});
panels.addEventListener('submit',e=>{const form=e.target.closest('form[data-qid]');if(!form)return;e.preventDefault();const q=questions.find(x=>x.id===form.dataset.qid),pr=q.solution.practice,fb=form.querySelector('.feedback'),solution=form.querySelector('.practice-solution');let correct=false;if(pr.type==='multiple_choice'){const selected=[...form.querySelectorAll('input[name=choice]:checked')].map(x=>x.value).sort(),expected=[...pr.answer].sort();if(!selected.length){fb.dataset.state='empty';fb.textContent='請先選擇答案，再送出。';return}correct=selected.length===expected.length&&selected.every((v,i)=>v===expected[i])}else{const input=form.querySelector('[name=numeric-answer]'),v=input.value.trim();if(!v){fb.dataset.state='empty';fb.textContent='請先輸入答案，再送出。';input.focus();return}correct=Number.isFinite(Number(v))&&Math.abs(Number(v)-Number(pr.answer))<=pr.grading.tolerance}const st=state.get(q.id);st.submitted=true;st.correct=correct;fb.dataset.state=correct?'correct':'wrong';fb.textContent=correct?'答對了！可以查看解析。':'答案尚未正確，請對照解析檢查。';solution.hidden=false;solution.querySelector('.score').textContent=correct?'判定：正確':'判定：尚未答對';form.querySelector('[data-action=submit-practice]').hidden=true;form.querySelector('[data-action=retry-practice]').hidden=false;setProgress()});
function resetPractice(id){const form=panels.querySelector(`form[data-qid="${CSS.escape(id)}"]`);form.reset();form.querySelector('.feedback').textContent='';form.querySelector('.feedback').removeAttribute('data-state');form.querySelector('.practice-solution').hidden=true;form.querySelector('[data-action=submit-practice]').hidden=false;form.querySelector('[data-action=retry-practice]').hidden=true;const s=state.get(id);s.submitted=false;s.correct=false;setProgress()}
function reset(id){resetPractice(id);state.get(id).step=1;updateSteps(id)}
let printDetails=[];window.addEventListener('beforeprint',()=>{printDetails=[...document.querySelectorAll('details.notes')].map(d=>({element:d,open:d.open}));printDetails.forEach(x=>x.element.open=true)});window.addEventListener('afterprint',()=>{printDetails.forEach(x=>x.element.open=x.open);printDetails=[]});
show(0);
</script></body></html>
