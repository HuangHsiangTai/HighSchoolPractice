type": "multiple_choice", "number": "2", "source": {"image": "週考1.jpg", "page": 1, "crop": {"x": 170, "y": 1040, "width": 1950, "height": 320}}, "stem": "下列選項中的對數值，哪些是正確的？", "options": {"A": "log(3−π)² = 2 log(3−π)", "B": "3^(−log₃ 7) = −7", "C": "log₂ 3 = log₄ 9", "D": "log 6 = log 2 + log 3", "E": "(log₃ 2)/(log₉ 8) = 2/3"}, "requiredSelections": null, "diagram": null, "uncertainties": [], "solution": {"id": "multiple-2", "questionVersion": 1, "topic": "對數定義域、運算法則與換底", "insight": "逐項先檢查對數真數是否為正，再使用對數運算律；注意負指數表示取倒數，換底時要把分子、分母的對數底數一致處理。", "steps": ["A：因為 π \u003e 3，所以 3−π \u003c 0。對任意非零實數 u，log(u²) = 2 log|u|；因此左邊 log((3−π)²) = 2 log|3−π| = 2 log(π−3)，其真數為正，左邊有定義。但右邊 log(3−π) 的真數為負，在實數範圍無定義，所以此等式不是正確的實數等式。平方後左邊可改寫成含絕對值的對數，不能因此把右側原本無定義的 log(3−π) 當成有定義。", "B：令 x = log₃7，則依對數定義 3ˣ = 7。故 3^(−log₃7) = 3^(−x) = 1/3ˣ = 1/7，而非 −7。負指數表示正數的倒數，不會使結果變成負數。", "C：用換底公式，log₄9 = (log 9)/(log 4) = (2 log 3)/(2 log 2) = (log 3)/(log 2) = log₂3。因此 log₂3 = log₄9，選項正確。", "D：log 2 與 log 3 在此均為常用對數，真數皆為正。乘積公式給出 log 2 + log 3 = log(2·3) = log 6，選項正確。", "E：以常用對數換底，(log₃2)/(log₉8) = (log 2/log 3)/(log 8/log 9)。由 log 8 = 3 log 2、log 9 = 2 log 3，得 (log 2/log 3)/(3 log 2/(2 log 3)) = 2/3；分母 log₉8 非零，故此比值有定義，選項正確。", "綜合各項，正確選項集合為 {C, D, E}。"], "answerStatus": "verified", "answer": ["C", "D", "E"], "answerText": "正確選項為 C、D、E。", "optionAnalysis": {"A": "錯。π \u003e 3，故右側 log(3−π) 的真數為負，在實數範圍無定義；雖然左側平方後的真數為正，等式仍不能成立。", "B": "錯。3^(−log₃7) = 1/(3^(log₃7)) = 1/7，不是 −7。負指數代表取倒數。", "C": "對。log₄9 = log(3²)/log(2²) = (2 log 3)/(2 log 2) = (log 3)/(log 2) = log₂3。", "D": "對。因 2、3 均為正，log 2 + log 3 = log(2·3) = log 6。", "E": "對。log₉8 = log 8/log 9 = 3 log 2/(2 log 3)，因此 (log₃2)/(log₉8) = (log 2/log 3)/(3 log 2/(2 log 3)) = 2/3。"}, "pitfalls": ["實數對數的定義條件是：對數底數 b 需 b\u003e0 且 b≠1，真數 x\u003e0。不能因為 (3−π)²\u003e0，就忽略右側 log(3−π) 的真數仍為負。", "對任意非零實數 u，log(u²)=2 log|u|；若寫成 2 log u，還須另外要求 u\u003e0。此題左側可寫成 2 log(π−3)，但右側 log(3−π) 仍無定義。", "a^(−r)=1/a^(r)；負指數表示倒數，不表示負值（a\u003e0）。", "換底公式是「原真數的常用對數 ÷ 原底數的常用對數」。例如 log₃2=(log 2)/(log 3)，不能把分子與分母對換；使用前須確認各對數有定義且分母不為 0。"], "notes": [], "practice": {"type": "multiple_choice", "stem": "在實數範圍內，下列哪些等式正確？（選 2 項）", "options": {"A": "log₅25=2", "B": "log₂(−4)=2", "C": "log(2×5)=log2+log5", "D": "log₃9=log₉3", "E": "log₄2=2"}, "requiredSelections": 2, "answer": ["A", "C"], "answerText": "正確選項為 A、C。", "steps": ["A：5²=25，所以 log₅25=2，正確。", "B：真數 −4\u003c0，實數對數沒有定義，錯誤。", "C：2 與 5 都是正數，乘積公式給 log(2×5)=log2+log5，正確。", "D：log₃9=2，而 log₉3=1/2，兩者不相等。", "E：4^(1/2)=2，所以 log₄2=1/2，不是 2。"]}}}, {"id": "numeric-1", "questionVersion": 1, "type": "numeric", "number": "1", "source": {"image": "週考1.jpg", "page": 1, "crop": {"x": 170, "y": 1390, "width": 1530, "height": 175}}, "stem": "使得對數 log₍ₓ₋₂₎(−x²+8x−7) 有意義的整數有＿＿個。", "options": {}, "requiredSelections": null, "diagram": null, "uncertainties": [], "solution": {"id": "numeric-1", "questionVersion": 1, "topic": "對數有意義的底數與真數條件", "insight": "對數 log₍ₓ₋₂₎(−x²+8x−7) 有意義，必須同時滿足底數為正、底數不等於 1，以及真數為正。先分別解條件，再取交集並數整數。", "steps": ["底數條件：x−2\u003e0，所以 x\u003e2；且 x−2≠1，所以 x≠3。", "真數條件：−x²+8x−7\u003e0。因式分解為 −(x−1)(x−7)\u003e0，即 (x−1)(x−7)\u003c0，因此 1\u003cx\u003c7。", "交集為 2\u003cx\u003c7 且 x≠3。符合的整數原本是 3、4、5、6，排除 x=3 後剩 4、5、6，共 3 個。", "核對：x=4、5、6 時底數分別為 2、3、4，均正且不等於 1；真數分別為 9、8、5，均為正。"], "answerStatus": "verified", "answer": null, "answerText": "共有 3 個整數：x=4、5、6。", "optionAnalysis": {}, "pitfalls": ["底數除了要大於 0，也不能等於 1；只解不等式 x−2\u003e0 會多算 x=3。", "真數條件是嚴格大於 0，二次式的兩個零點不能納入。", "題目問整數個數，先求完整範圍再數，避免漏掉端點檢查。"], "notes": [], "practice": {"type": "numeric", "stem": "使 log₍ₓ₊₁₎(−x²+5x+6) 有意義的整數 x 有幾個？", "options": {}, "requiredSelections": null, "answer": null, "answerText": "共有 5 個整數：x=1、2、3、4、5。", "steps": ["底數條件 x+1\u003e0 給 x\u003e−1；底數不能等於 1，故 x≠0。", "真數 −x²+5x+6=−(x−6)(x+1)\u003e0，解得 −1\u003cx\u003c6。", "交集中的整數為 0、1、2、3、4、5，再排除 x=0，剩 1、2、3、4、5，共 5 個。", "檢查 x=1 至 5 時底數為 2 至 6，真數依序為 10、12、12、10、6，均符合條件。"], "grading": {"acceptedAnswers": ["5"], "tolerance": 0, "unit": "個整數", "rule": "輸入整數 5 即判定正確；不接受其他數值。"}}}}, {"id": "numeric-3", "q <script>
'use strict';
const questions=JSON.parse(document.getElementById('lesson-data').textContent);
const nav=document.getElementById('question-nav'), panels=document.getElementById('panels');
const state=new Map(questions.map(q=>[q.id,{step:1,submitted:false,correct:false}]));

function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rich(s){let t=escapeHTML(s);t=t.replace(/ln(?=\d|\s|\()/g,'log');t=t.replace(/介值定理保證 \(0,1\/4\) 內至少有一根。/g,'圖形連續，函數值由正變負，因此中間必經過 0（介值定理），在 (0, 1/4) 內至少有一根。');t=t.replace(/([A-Za-z0-9]+)\^\(([^()]*)\)/g,'<span class="math">$1<sup>$2</sup></span>');t=t.replace(/([A-Za-z0-9]+)\^([−-]?[0-9]+)/g,'<span class="math">$1<sup>$2</sup></span>');const subs={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','ₓ':'x','₋':'−','₊':'+','₍':'(','₎':')'};t=t.replace(/([A-Za-z]+)₍([^₎]+)₎/g,(_,b,e)=>`<span class="math">${b}<sub>${[...e].map(c=>subs[c]??c).join('')}</sub></span>`);t=t.replace(/log([₀-₉]+)/g,(_,base)=>`<span class="math">log<sub>${[...base].map(c=>subs[c]??c).join('')}</sub></span>`);t=t.replace(/[₀-₉ₓ₋₊₍₎]+/g,run=>`<sub>${[...run].map(c=>subs[c]??c).join('')}</sub>`);const sups={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'−','⁺':'+','ˣ':'x','ᵘ':'u','ᵛ':'v'};t=t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺ˣᵘᵛ]+/g,run=>`<sup>${[...run].map(c=>sups[c]??c).join('')}</sup>`);t=t.replace(/\(1\/3\)ˣ/g,'<span class="math">(⅓)<sup>x</sup></span>');t=t.replace(/\(−2,\+∞\)/g,'<span class="math">(−2, +∞)</span>');return t;}
function render(q){
 const s=q.solution, practice=s.practice;
 const options=Object.entries(q.options).map(([k,v])=>`<li><span class="letter">(${k})</span>${rich(v)}</li>`).join('');

 const analyses=Object.entries(s.optionAnalysis).map(([k,v])=>`<li><strong>(${k})</strong> ${rich(v)}</li>`).join('');
 const stepHTML=s.steps.map((x,i)=>`<li class="step ${i>0?'step-hidden':''}" data-step="${i+1}"><span>${rich(x)}</span></li>`).join('');
 const numberLabel=practice.grading?.unit?.includes('整數')?'整數個數':'實根個數';
 const practiceChoices=practice.type==='multiple_choice'?`<div class="practice-options">${Object.entries(practice.options).map(([k,v])=>`<label class="practice-option"><input id="practice-${q.id}-${escapeHTML(k)}" type="checkbox" name="choice" value="${escapeHTML(k)}"><span><span class="letter">(${escapeHTML(k)})</span>${rich(v)}</span></label>`).join('')}</div>`:`<label class="number-row" for="practice-answer-${q.id}"><span>請填${numberLabel}（需完全相符）：</span><input id="practice-answer-${q.id}" type="number" name="numeric-answer" step="any" inputmode="decimal" aria-label="請填${numberLabel}（需完全相符），單位：個"><span class="unit">個</span></label>`;
 const psteps=practice.steps.map((x,i)=>`<li><span>${rich(x)}</span></li>`).join('');
 const answerText=rich(s.answerText);
 return `<article class="panel" id="panel-${q.id}" data-qid="${q.id}" aria-labelledby="title-${q.id}" ${q===questions[0]?'':'hidden'}>
 <header class="panel-head"><span class="kicker">${q.type==='multiple_choice'?'多選題':'填充題'} · ${escapeHTML(q.number)}</span><h2 id="title-${q.id}">${rich(s.topic)}</h2><span class="tag">答案已驗證</span></header>
 <section class="section"><h3>原題</h3><div class="question-box"><p class="stem">${q.id==='multiple-1'?`設 <span class="math"><i>y</i>=<i>f</i>(<i>x</i>)=<i>a</i><sup><i>x</i></sup>+<i>b</i></span> 如圖所示，則下列哪些選項正確？`:q.id==='multiple-2'?`下列選項中的對數值，哪些是正確的？`:q.id==='numeric-1'?`使得對數 <span class="math">log<sub><i>x</i>−2</sub>(−<i>x</i><sup>2</sup>+8<i>x</i>−7)</span> 有意義的整數有＿＿個。`:`方程式 <span class="math">4<sup>−|<i>x</i>|</sup>=4<i>x</i></span> 有＿＿個實根。`}</p>${options?`<ul class="options">${options}</ul>`:''}${q.id==='multiple-1'?diagram:''}</div><p class="caption">來源：週考1.jpg，第 1 頁${q.type==='multiple_choice'&&q.id==='multiple-1'?'；圖形僅表達相對位置':''}。</p></section>
 <section class="section"><h3>讀題切入點</h3><p class="insight"><strong>先看：</strong>${rich(s.insight)}</p></section>
 <section class="section"><h3>逐步推導</h3><ol class="steps solution-steps">${stepHTML}</ol><div class="controls"><button type="button" data-action="prev-step">上一步</button><button type="button" data-action="next-step" class="primary">下一步</button><button type="button" data-action="show-all">展開全部</button></div></section>
 <section class="section original-answer"><h3>原題答案與選項分析</h3><div class="answer-box"><p class="answer-title">${s.answerStatus==='verified'?'已驗證答案':'原題選項有疑義'}</p><p class="answer-text">${answerText}</p>${analyses?`<ul class="analysis">${analyses}</ul>`:''}</div></section>
 <section class="section"><h3>注意事項</h3><ul class="pitfalls">${s.pitfalls.map(p=>`<li>${rich(p)}</li>`).join('')}</ul></section>
 <section class="section"><div class="practice-card"><h3>變化練習</h3><p class="practice-stem">${rich(practice.stem)}</p><form data-qid="${q.id}" novalidate>${practiceChoices}<div class="controls"><button type="submit" data-action="submit-practice" class="primary">送出作答</button><button type="button" data-action="retry-practice" class="secondary" hidden>重新作答</button></div><div class="feedback" aria-live="polite" role="status"></div><div class="practice-solution" hidden><h4>答案與解析</h4><p class="score"></p><p>${rich(practice.answerText)}</p><ol class="steps">${psteps}</ol></div></form></div></section>
 </article>`;
}
questions.forEach((q,i)=>{let b=document.createElement('button');b.type='button';b.id=`nav-${q.id}`;b.textContent=`${q.type==='multiple_choice'?'多選':'填充'} ${q.number}`;b.setAttribute('aria-controls',`panel-${q.id}`);b.addEventListener('click',()=>showQuestion(i));nav.append(b);panels.insertAdjacentHTML('beforeend',render(q));});
function activePanel(){return document.getElementById(`panel-${questions[current].id}`)}
function stepUpdate(){const q=questions[current],p=activePanel(),n=state.get(q.id).step,steps=[...p.querySelectorAll('.solution-steps li')];steps.forEach((li,i)=>li.classList.toggle('step-hidden',i>=n));document.getElementById('prev-step').disabled=n<=1;document.getElementById('next-step').disabled=n>=steps.length;document.getElementById('show-all').textContent=n>=steps.length?'已展開全部推導':'展開全部推導';p.querySelector('[data-action="prev-step"]').disabled=n<=1;p.querySelector('[data-action="next-step"]').disabled=n>=steps.length;p.querySelector('[data-action="show-all"]').textContent=n>=steps.length?'已展開全部':'展開全部';}
function showQuestion(i){current=Math.max(0,Math.min(questions.length-1,i));questions.forEach((q,j)=>{let p=document.getElementById(`panel-${q.id}`),b=document.getElementById(`nav-${q.id}`);p.hidden=j!==current;if(j===current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});document.getElementById('prev-question').disabled=current===0;document.getElementById('next-question').disabled=current===questions.length-1;const completed=questions.filter(q=>state.get(q.id).correct).length;document.getElementById('progress-copy').textContent=`第 ${current+1} / ${questions.length} 題`;document.getElementById('completion-count').textContent=String(completed);stepUpdate();}
function setStep(delta){const q=questions[current],len=activePanel().querySelectorAll('.solution-steps li').length;state.get(q.id).step=Math.max(1,Math.min(len,state.get(q.id).step+delta));stepUpdate();}
document.getElementById('prev-question').addEventListener('click',()=>showQuestion(current-1));document.getElementById('next-question').addEventListener('click',()=>showQuestion(current+1));document.getElementById('prev-step').addEventListener('click',()=>setStep(-1));document.getElementById('next-step').addEventListener('click',()=>setStep(1));document.getElementById('show-all').addEventListener('click',()=>{state.get(questions[current].id).step=activePanel().querySelectorAll('.solution-steps li').length;stepUpdate()});document.getElementById('reset-question').addEventListener('click',()=>resetQuestion(questions[current].id));
panels.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(!a)return;const panel=a.closest('.panel'),id=panel.dataset.qid;if(a.dataset.action==='prev-step')state.get(id).step=Math.max(1,state.get(id).step-1);if(a.dataset.action==='next-step')state.get(id).step=Math.min(panel.querySelectorAll('.solution-steps li').length,state.get(id).step+1);if(a.dataset.action==='show-all')state.get(id).step=panel.querySelectorAll('.solution-steps li').length;stepUpdate();if(a.dataset.action==='retry-practice')resetPractice(id)});
panels.addEventListener('submit',e=>{const form=e.target.closest('form[data-qid]');if(!form)return;e.preventDefault();const id=form.dataset.qid,q=questions.find(x=>x.id===id),p=q.solution.practice,feedback=form.querySelector('.feedback'),sol=form.querySelector('.practice-solution'),retry=form.querySelector('[data-action="retry-practice"]');let correct=false;
 if(p.type==='multiple_choice'){const chosen=[...form.querySelectorAll('input[name="choice"]:checked')].map(x=>x.value).sort(),expected=[...p.answer].sort();if(!chosen.length){feedback.dataset.state='empty';feedback.textContent='請先選擇答案，再送出。';return}correct=chosen.length===expected.length&&chosen.every((x,i)=>x===expected[i]);}
 else{const input=form.querySelector('[name="numeric-answer"]'),value=input.value.trim();if(value===''){feedback.dataset.state='empty';feedback.textContent='請先輸入答案，再送出。';input.focus();return}const n=Number(value),g=p.grading;correct=Number.isFinite(n)&&g.acceptedAnswers.some(a=>Math.abs(n-Number(a))<=g.tolerance);}
 state.get(id).submitted=true;state.get(id).correct=correct;feedback.dataset.state=correct?'correct':'wrong';feedback.textContent=correct?'答對了！可以查看解析並練習下一題。':'這次答案不完全正確，請對照解析找出需要修正的地方。';sol.hidden=false;sol.querySelector('.score').textContent=correct?'判定：正確':'判定：尚未答對';form.querySelector('[data-action="submit-practice"]').hidden=true;retry.hidden=false;showQuestion(current);
});
function resetPractice(id){const p=document.querySelector(`form[data-qid="${id}"]`);if(!p)return;p.reset();const fb=p.querySelector('.feedback');fb.textContent='';fb.removeAttribute('data-state');p.querySelector('.practice-solution').hidden=true;p.querySelector('[data-action="submit-practice"]').hidden=false;p.querySelector('[data-action="retry-practice"]').hidden=true;state.get(id).submitted=false;state.get(id).correct=false;showQuestion(current)}
function resetQuestion(id){const q=questions.find(x=>x.id===id);resetPractice(id);state.get(id).step=1;stepUpdate()}
showQuestion(0);
</script>
</body>
</html>
